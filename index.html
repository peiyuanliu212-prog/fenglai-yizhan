<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>风来驿站</title>
<style>
  :root{
    --paper:#F4EFE4; --card:#FBF8F0; --ink:#2B2620; --ink2:#6B6151;
    --line:#D8CFBB; --accent:#A93226; --accent-ink:#8C2B20; --ok:#3E6B34;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Noto Serif SC","Songti SC","STSong",serif;
    font-size:15px; line-height:1.55;
  }
  #app{max-width:480px; margin:0 auto; padding:14px 14px 40px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(43,38,32,.05);}
  .card h3{margin:0 0 10px; font-size:15px; letter-spacing:2px; border-bottom:1px solid var(--line); padding-bottom:8px;}
  .sign{text-align:center; padding:18px 10px 14px; border:2px solid var(--ink); border-radius:8px; background:var(--card); margin-bottom:12px;}
  .sign .inn-name{font-size:26px; letter-spacing:6px; font-weight:700;}
  .sign .inn-sub{color:var(--ink2); font-size:13px; letter-spacing:3px; margin-top:4px;}
  .sign .seal{display:inline-block; margin-top:8px; color:var(--accent-ink); border:1px solid var(--accent); border-radius:4px; padding:0 8px; font-size:12px; letter-spacing:2px;}
  .wallet{display:flex; gap:8px; margin-bottom:12px;}
  .wallet .cell{flex:1; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 6px; text-align:center;}
  .wallet .k{font-size:12px; color:var(--ink2); letter-spacing:2px;}
  .wallet .v{font-size:19px; font-weight:700;}
  .wallet .v.coin{color:var(--accent-ink);}
  .rooms{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .room{border:1px solid var(--line); border-radius:8px; padding:8px 4px 6px; text-align:center; min-height:96px; background:var(--paper);}
  .room.empty{color:var(--ink2); display:flex; align-items:center; justify-content:center; font-size:12px; letter-spacing:2px;}
  .room .gname{font-size:13px; font-weight:700; margin-top:2px;}
  .room .gtype{font-size:11px; color:var(--ink2); letter-spacing:1px;}
  .room .gstay{font-size:11px; color:var(--accent-ink);}
  .rate-line{margin-top:10px; font-size:13px; color:var(--ink2); text-align:center;}
  .rate-line b{color:var(--ink);}
  .up-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line);}
  .up-row:last-child{border-bottom:none; padding-bottom:2px;}
  .up-row .info{flex:1;}
  .up-row .info .t{font-weight:700;}
  .up-row .info .d{font-size:12px; color:var(--ink2);}
  button{
    font-family:inherit; font-size:14px; letter-spacing:1px;
    background:var(--ink); color:var(--paper); border:1px solid var(--ink);
    border-radius:8px; padding:9px 14px; cursor:pointer;
  }
  button.accent{background:var(--accent); border-color:var(--accent-ink); color:#FBF3E4;}
  button.small{font-size:12px; padding:6px 10px;}
  button.ghost{background:transparent; color:var(--ink); border-color:var(--line);}
  button:disabled{background:#CFC6B0; border-color:#CFC6B0; color:#7A7261; cursor:not-allowed;}
  button:active{transform:translateY(1px);}
  #offlineCard{border-color:var(--accent);}
  #offlineCard .amt{font-size:22px; font-weight:700; color:var(--accent-ink);}
  #morningCard{border-color:var(--accent); display:none;}
  .log{list-style:none; margin:0; padding:0; font-size:13px; color:var(--ink2);}
  .log li{padding:3px 0; border-bottom:1px dashed var(--line);}
  .log li:last-child{border-bottom:none;}
  .open-wrap{padding-top:12vh; text-align:center;}
  .open-wrap .big{font-size:30px; letter-spacing:8px; font-weight:700; margin-bottom:6px;}
  .open-wrap .sub{color:var(--ink2); letter-spacing:2px; margin-bottom:26px; font-size:13px;}
  .open-wrap input{
    font-family:inherit; font-size:17px; text-align:center; letter-spacing:3px;
    width:80%; max-width:300px; padding:11px 8px; border:1px solid var(--ink);
    border-radius:8px; background:var(--card); color:var(--ink); margin-bottom:16px;
  }
  .foot{text-align:center; color:var(--ink2); font-size:12px; letter-spacing:2px; margin-top:18px;}
  .btnrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .tag{display:inline-block; border:1px solid var(--line); border-radius:4px; padding:0 6px; font-size:11px; color:var(--ink2); margin:2px 2px 2px 0;}
  .tag.seen{border-color:var(--accent); color:var(--accent-ink);}
  .tag.lock{opacity:.55;}
  textarea{
    font-family:inherit; font-size:12px; width:100%; min-height:64px;
    border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); padding:8px;
  }
  .small-note{font-size:12px; color:var(--ink2);}
  .sect{font-size:12px; letter-spacing:3px; color:var(--ink2); margin:14px 0 6px; padding-top:12px; border-top:1px dashed var(--line);}
  .sect:first-child{margin-top:0; padding-top:0; border-top:none;}
  .code-in{
    font-family:inherit; font-size:14px; letter-spacing:2px; width:100%;
    border:1px solid var(--line); border-radius:8px; background:var(--paper);
    color:var(--ink); padding:9px 10px; margin-top:8px; text-transform:uppercase;
  }
  .cloud-code{font-size:20px; font-weight:700; letter-spacing:3px; color:var(--accent-ink); padding:4px 0 2px;}
  .nav{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .nav a{
    flex:1 1 auto; text-align:center; text-decoration:none; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:8px;
    padding:7px 4px; font-size:12px; letter-spacing:1px; white-space:nowrap;
  }
  .nav a:active{transform:translateY(1px);}
  .bar{height:8px; background:var(--paper); border:1px solid var(--line); border-radius:5px; overflow:hidden; margin:6px 0 4px;}
  .bar i{display:block; height:100%; background:var(--accent); width:0;}
  .group-line{font-size:13px; font-weight:700; letter-spacing:2px; margin:10px 0 4px; border-top:1px dashed var(--line); padding-top:8px;}
  .group-line:first-child{border-top:none; margin-top:0; padding-top:0;}
  .modal-mask{
    position:fixed; inset:0; background:rgba(43,38,32,.45); z-index:60;
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .modal-box{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; max-width:420px; width:100%;}
  .modal-box h3{margin:0 0 10px; font-size:15px; letter-spacing:2px; border-bottom:1px solid var(--line); padding-bottom:8px;}
  @keyframes toastpop{0%{transform:translateX(-50%) translateY(8px);}100%{transform:translateX(-50%) translateY(0);}}
  #toast.pop{animation:toastpop .18s ease-out;}
  textarea:focus, .code-in:focus, .open-wrap input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  /* ---- 新手引导（照联赛 v58 底部讲解台形态）：气泡固定停靠底部同一处永不移动，位置零计算 ---- */
  .tourRing{position:fixed; z-index:300; border:2px solid var(--accent); border-radius:12px; box-shadow:0 0 0 9999px rgba(43,38,32,.48); pointer-events:none; animation:tourPulse 1.6s ease-in-out infinite;}
  @keyframes tourPulse{0%,100%{outline:0 solid rgba(169,50,38,0)}50%{outline:6px solid rgba(169,50,38,.18)}}
  #tourBubble{position:fixed; z-index:310; left:50%; transform:translateX(-50%); width:100%; max-width:480px; bottom:0; max-height:36vh; overflow-y:auto; background:var(--card); color:var(--ink); border-top:2px solid var(--accent); border-radius:16px 16px 0 0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow:0 -8px 28px rgba(43,38,32,.35); pointer-events:none;}
  #tourBubble button{pointer-events:auto;}
  #tourBubble .tmeta{color:var(--ink2); font-size:12px; letter-spacing:1px;}
  #tourBubble .ttitle{font-size:15px; font-weight:700; margin:3px 0;}
  #tourBubble .tbody{font-size:13px; color:var(--ink2); line-height:1.6;}
  #tourBubble .tourDots{font-size:8px; letter-spacing:2px; color:var(--accent); white-space:nowrap;}
  #tourBubble .tourDots .off{color:var(--line);}
  #tourBubble .trow{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  #tourBubble .tbtns{display:flex; gap:8px; align-items:center; margin-top:9px;}
  body.touring #app{padding-bottom:330px;}
  #toast{
    position:fixed; left:50%; bottom:34px; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:9px 18px; border-radius:8px;
    font-size:14px; letter-spacing:1px; display:none; z-index:50; max-width:86vw; text-align:center;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="tourRing" class="tourRing" style="display:none"></div>
<div id="tourBubble" style="display:none"></div>

<script>
'use strict';
/* ================= 配置表（全部数值单一出处，禁魔法数散落） ================= */
const CONFIG = {
  version: 4,
  /* 云端短码后端（三国 sgvault 同路：拼将系列 CloudBase activity_api 公开路由，短码即凭证、无平台登录态）。
     请求层双路：壳内优先 window.ColorboxAI.cloud.request（/api/yzvault/*），非壳回退 fetch(vaultApi)。
     部署完成后由总台把网关地址填入 vaultApi（与三国客户端同一个网关）；无壳且留空 = 未配置，
     客户端会明确提示「尚未开通」且长码通道照常可用，绝不假装成功。部署清单见工程根目录《云端短码部署说明》。 */
  vaultApi: '',
  vaultPrefix: 'YZ-',
  vaultPayloadMax: 262144,
  startCoins: 100,
  startRooms: 2,
  tickMs: 2000,
  roomPriceBase: 5,
  qualityMult: [0, 1, 1.5, 2.2, 3.0, 4.0],
  qualityNames: ['', '粗布陋室', '整洁客房', '雅致客房', '上房', '天字号上房'],
  maxRooms: 12,
  maxQuality: 5,
  addRoomCostBase: 80,  addRoomCostGrowth: 1.55,
  qualityCostBase: 120, qualityCostGrowth: 1.8,
  arrivalChancePerTick: 0.45,
  stayMinTicks: 3, stayMaxTicks: 8,
  famePerCheckout: 1,
  famePerCheckoutChance: 0.5,
  fameThresholds: [0, 25, 70, 150, 260, 420, 650, 950, 1350, 1900],
  offlineRate: 0.55,
  offlineCapHours: 12,
  offlineMinMinutes: 1,
  /* 厨房：餐饮附加 = 基础房费收入 × kitchenLv × kitchenMultPerLv（并入 incomeRate） */
  kitchenMax: 10, kitchenCostBase: 100, kitchenCostGrowth: 1.6, kitchenMultPerLv: 0.08,
  /* 马厩：委托报酬 ×(1+stableLv×stableRewardPerLv)，到访率 +stableLv×stableArrivalPerLv（并入公式） */
  stableMax: 10, stableCostBase: 100, stableCostGrowth: 1.6, stableRewardPerLv: 0.10, stableArrivalPerLv: 0.02,
  /* 设施等级上限随驿站等级细化：厨房上限=min(kitchenMax, level+2)，马厩上限=min(stableMax, level+1) */
  /* 伙计：hire 雇佣费，upBase/upGrowth 升级费；bonusPerLv 并入对应公式
     innkeeper 掌柜→总收入 / waiter 小二→总收入(服务) / cook 厨子→餐饮收入 / groom 马夫→委托报酬 */
  staffTypes: [
    { id:'innkeeper', label:'掌柜', desc:'总收入 +6%/级', hire:150, upBase:90,  upGrowth:1.7, maxLv:5, incomePerLv:0.06 },
    { id:'waiter',    label:'小二', desc:'总收入 +4%/级', hire:100, upBase:70,  upGrowth:1.7, maxLv:5, incomePerLv:0.04 },
    { id:'cook',      label:'厨子', desc:'总收入 +5%/级（餐饮）', hire:120, upBase:80, upGrowth:1.7, maxLv:5, incomePerLv:0.05 },
    { id:'groom',     label:'马夫', desc:'委托报酬 +8%/级', hire:100, upBase:70,  upGrowth:1.7, maxLv:5, commissionPerLv:0.08 }
  ],
  /* 日期门（真实本地日期，packActive 口径：本地日期 >= 门日即开） */
  gates: { commission:'2026-11-19', banquet:'2026-11-22', noble:'2026-11-26' },
  /* 商队委托三档 */
  commissionTiers: [
    { id:'c2',  hours:2,  coins:120, fame:2 },
    { id:'c6',  hours:6,  coins:400, fame:6 },
    { id:'c12', hours:12, coins:900, fame:14 }
  ],
  commissionMaxActive: 3,
  /* 广告点位与日限 */
  adsLimit: { gift:2, instant:3 },
  giftReward: 150,
  adSimMs: 900,
  /* 每日事件张数 */
  eventsPerDay: 3,
  /* 新手引导走完谢礼（走 ledger 发放，仅一次） */
  guideReward: 30,
  /* 旅客池 32 种：weight 权重 / priceMult 价格系数 / minLevel 等级门 / minKitchen / minStable / gate 日期门 */
  guestTypes: [
    { id:'scholar',   label:'书生',     weight:30, priceMult:0.9, minLevel:1 },
    { id:'hunter',    label:'猎户',     weight:20, priceMult:0.8, minLevel:1 },
    { id:'monk',      label:'僧人',     weight:16, priceMult:0.7, minLevel:1 },
    { id:'escort',    label:'镖师',     weight:22, priceMult:1.1, minLevel:1 },
    { id:'hero',      label:'侠客',     weight:14, priceMult:1.2, minLevel:1 },
    { id:'peddler',   label:'货郎',     weight:18, priceMult:0.9, minLevel:1 },
    { id:'porter',    label:'脚夫',     weight:18, priceMult:0.7, minLevel:1 },
    { id:'farmer',    label:'老农',     weight:16, priceMult:0.7, minLevel:1 },
    { id:'merchant',  label:'商贾',     weight:18, priceMult:1.6, minLevel:2 },
    { id:'examiner',  label:'赶考举子', weight:14, priceMult:1.0, minLevel:2 },
    { id:'teamerchant',label:'茶商',    weight:14, priceMult:1.4, minLevel:2, minStable:1 },
    { id:'doctor',    label:'游方郎中', weight:12, priceMult:1.1, minLevel:2 },
    { id:'musician',  label:'乐师',     weight:12, priceMult:1.1, minLevel:3 },
    { id:'painter',   label:'画师',     weight:11, priceMult:1.2, minLevel:3 },
    { id:'storyteller',label:'说书人',  weight:12, priceMult:1.0, minLevel:3 },
    { id:'singer',    label:'歌姬',     weight:10, priceMult:1.5, minLevel:3, minKitchen:2 },
    { id:'blacksmith',label:'铁匠',     weight:11, priceMult:1.0, minLevel:3 },
    { id:'fortune',   label:'算命先生', weight:9,  priceMult:1.0, minLevel:4 },
    { id:'saltmerchant',label:'盐商',   weight:11, priceMult:1.7, minLevel:4, minStable:2 },
    { id:'herbmerchant',label:'药商',   weight:11, priceMult:1.5, minLevel:4, minKitchen:2 },
    { id:'tailor',    label:'裁缝',     weight:10, priceMult:1.1, minLevel:4 },
    { id:'constable', label:'捕快',     weight:10, priceMult:1.1, minLevel:5 },
    { id:'richman',   label:'富商',     weight:9,  priceMult:2.0, minLevel:5, minKitchen:3 },
    { id:'escortboss',label:'镖头',     weight:9,  priceMult:1.6, minLevel:5, minStable:3 },
    { id:'magistrate',label:'县官',     weight:7,  priceMult:1.8, minLevel:6 },
    { id:'foreign',   label:'外邦商人', weight:8,  priceMult:2.2, minLevel:6, minStable:4 },
    { id:'hermit',    label:'隐士',     weight:6,  priceMult:1.3, minLevel:7 },
    { id:'zhuangyuan',label:'新科状元', weight:5,  priceMult:2.0, minLevel:8, gate:'noble' },
    { id:'inspector', label:'钦差大臣', weight:4,  priceMult:2.4, minLevel:8, gate:'noble' },
    { id:'junzhu',    label:'郡主',     weight:4,  priceMult:2.6, minLevel:9, gate:'noble' },
    { id:'wangye',    label:'王爷',     weight:3,  priceMult:3.0, minLevel:9, gate:'noble' },
    { id:'richest',   label:'江南首富', weight:4,  priceMult:2.8, minLevel:10, gate:'noble' }
  ],
  /* 旅客事件抉择池：choices 各含 coins/fame/favor 增减（走 ledger） */
  events: [
    { id:'e_rain', pool:'daily', title:'夜雨留客', text:'大雨封路，一位旅客想多住一晚却囊中羞涩。', choices:[
      { label:'免一晚房钱结善缘', coins:0, fame:3, favor:2 }, { label:'照价收钱', coins:20, fame:0, favor:-1 } ] },
    { id:'e_wine', pool:'daily', title:'讨酒的侠客', text:'侠客拍下碎银，要烫一壶好酒。', choices:[
      { label:'烫酒相赠', coins:-10, fame:2, favor:2 }, { label:'按牌价卖酒', coins:25, fame:0, favor:0 } ] },
    { id:'e_lost', pool:'daily', title:'遗落的钱袋', text:'小二在房里拾到一只沉甸甸的钱袋。', choices:[
      { label:'挂出招领', coins:0, fame:4, favor:1 }, { label:'悄悄收起', coins:40, fame:-2, favor:-2 } ] },
    { id:'e_sick', pool:'daily', title:'染病的旅客', text:'一位旅客半夜发热，需要熬药照料。', choices:[
      { label:'熬药守夜', coins:-15, fame:3, favor:3 }, { label:'请他另投别家', coins:0, fame:-2, favor:-2 } ] },
    { id:'e_quarrel', pool:'daily', title:'堂前争执', text:'两名旅客为一间上房争执不下。', choices:[
      { label:'掌柜出面调解', coins:0, fame:2, favor:2 }, { label:'谁出价高谁住', coins:30, fame:-1, favor:-1 } ] },
    { id:'e_letter', pool:'daily', title:'捎一封家书', text:'书生托你把家书捎去邻县。', choices:[
      { label:'让脚夫顺路捎去', coins:-5, fame:2, favor:2 }, { label:'婉言谢绝', coins:0, fame:0, favor:0 } ] },
    { id:'e_horse', pool:'daily', title:'受惊的马匹', text:'马厩里一匹马受惊，踢坏了栏杆。', choices:[
      { label:'赔钱安抚马主', coins:-20, fame:1, favor:2 }, { label:'据理不赔', coins:0, fame:-2, favor:-1 } ] },
    { id:'e_tip', pool:'daily', title:'丰厚的赏钱', text:'富商对饭菜满意，留下赏钱，指名赏给厨子。', choices:[
      { label:'全数转交厨子', coins:10, fame:1, favor:3 }, { label:'驿站留一半', coins:25, fame:0, favor:-1 } ] },
    { id:'b_feast', pool:'banquet', title:'宴会厅·乡绅寿宴', text:'本地乡绅要借宴会厅办六十寿宴。', choices:[
      { label:'精心筹备', coins:60, fame:5, favor:2 }, { label:'简单操办', coins:90, fame:1, favor:0 } ] },
    { id:'b_wedding', pool:'banquet', title:'宴会厅·喜宴', text:'一对新人想在驿站办喜宴，图个热闹。', choices:[
      { label:'挂红贴喜，办得体面', coins:50, fame:4, favor:3 }, { label:'按常价承接', coins:80, fame:1, favor:0 } ] },
    { id:'b_poet', pool:'banquet', title:'宴会厅·诗会', text:'文人雅士包下宴会厅开诗会。', choices:[
      { label:'备好笔墨清茶', coins:20, fame:6, favor:2 }, { label:'只管收场地钱', coins:55, fame:1, favor:0 } ] },
    { id:'b_guild', pool:'banquet', title:'宴会厅·商会年会', text:'商会要在宴会厅议事三日。', choices:[
      { label:'安排茶点伺候周到', coins:70, fame:4, favor:2 }, { label:'明码标价不多事', coins:100, fame:0, favor:0 } ] }
  ],
  /* 旅客类别分组（图鉴套装进度明牌用，纯展示配置：32 种全覆盖，只读 guestsSeen 布尔） */
  guestGroups: [
    { label:'文士类', ids:['scholar','examiner','storyteller','painter','zhuangyuan'] },
    { label:'商贾类', ids:['peddler','merchant','teamerchant','saltmerchant','herbmerchant','foreign','richman','richest'] },
    { label:'江湖类', ids:['escort','escortboss','hero','hunter','blacksmith'] },
    { label:'行旅类', ids:['porter','farmer','doctor','tailor','fortune'] },
    { label:'方外艺人类', ids:['monk','hermit','musician','singer'] },
    { label:'官贵类', ids:['constable','magistrate','inspector','junzhu','wangye'] }
  ],

/* ================= 存档层（唯一出入口） ================= */
function defaultState(){
  return {
    v: CONFIG.version,
    name: '',
    coins: CONFIG.startCoins,
    fame: 0,
    favor: 0,
    level: 1,
    rooms: { count: CONFIG.startRooms, quality: 1 },
    kitchenLv: 0,
    stableLv: 0,
    staff: {},
    guests: [],
    guestsSeen: {},
    miles: {},
    commissions: [],
    lastSeen: Date.now(),
    day: dayStr(),
    ads: {},
    acc: 0,
    offlinePending: 0,
    log: [],
    totalGuests: 0,
    totalEarned: 0,
    totalCommissions: 0,
    totalEvents: 0,
    dayStats: { guests: 0, earned: 0 },
    eventsToday: [],
    eventsDone: 0,
    morning: null,
    guideStep: 0,
    guideDone: false,
    guideRewarded: false,
    settings: { bgm: true, sfx: true }
  };
}
function normalize(raw){
  const d = defaultState();
  if(!raw || typeof raw !== 'object') return d;
  const s = Object.assign({}, d, raw);
  s.rooms = Object.assign({}, d.rooms, (raw.rooms && typeof raw.rooms === 'object') ? raw.rooms : {});
  s.rooms.count = clampInt(s.rooms.count, 1, CONFIG.maxRooms, CONFIG.startRooms);
  s.rooms.quality = clampInt(s.rooms.quality, 1, CONFIG.maxQuality, 1);
  s.kitchenLv = clampInt(s.kitchenLv, 0, CONFIG.kitchenMax, 0);
  s.stableLv = clampInt(s.stableLv, 0, CONFIG.stableMax, 0);
  s.staff = (raw.staff && typeof raw.staff === 'object') ? raw.staff : {};
  for(const k of Object.keys(s.staff)){
    const t = CONFIG.staffTypes.find(x => x.id === k);
    if(!t){ delete s.staff[k]; continue; }
    s.staff[k] = { lv: clampInt(s.staff[k] && s.staff[k].lv, 1, t.maxLv, 1) };
  }
  s.guests = Array.isArray(raw.guests) ? raw.guests.filter(g => g && g.type && g.name) : [];
  s.guestsSeen = (raw.guestsSeen && typeof raw.guestsSeen === 'object') ? raw.guestsSeen : {};
  s.miles = (raw.miles && typeof raw.miles === 'object') ? raw.miles : {};
  s.commissions = Array.isArray(raw.commissions) ? raw.commissions.filter(c => c && c.tierId && !c.claimed) : [];
  s.ads = (raw.ads && typeof raw.ads === 'object') ? raw.ads : {};
  s.log = Array.isArray(raw.log) ? raw.log.slice(0, 8) : [];
  s.coins = Math.max(0, Math.floor(+s.coins || 0));
  s.fame = Math.max(0, Math.floor(+s.fame || 0));
  s.favor = Math.floor(+s.favor || 0);
  s.acc = Math.max(0, +s.acc || 0);
  s.offlinePending = Math.max(0, +s.offlinePending || 0);
  s.totalGuests = Math.max(0, Math.floor(+s.totalGuests || 0));
  s.totalEarned = Math.max(0, Math.floor(+s.totalEarned || 0));
  s.totalCommissions = Math.max(0, Math.floor(+s.totalCommissions || 0));
  s.totalEvents = Math.max(0, Math.floor(+s.totalEvents || 0));
  s.dayStats = (raw.dayStats && typeof raw.dayStats === 'object')
    ? { guests: Math.max(0, Math.floor(+raw.dayStats.guests || 0)), earned: Math.max(0, Math.floor(+raw.dayStats.earned || 0)) }
    : { guests: 0, earned: 0 };
  s.eventsToday = Array.isArray(raw.eventsToday) ? raw.eventsToday.filter(id => CONFIG.events.some(e => e.id === id)) : [];
  s.eventsDone = clampInt(s.eventsDone, 0, CONFIG.eventsPerDay, 0);
  s.morning = (raw.morning && typeof raw.morning === 'object') ? raw.morning : null;
  s.settings = Object.assign({}, d.settings, (raw.settings && typeof raw.settings === 'object') ? raw.settings : {});
  /* 引导字段（v4 加法加入，不动既有字段语义）：带字段的档照原值；
     无字段的老档——已开张（有 name）默认标完成不补弹，未开张从头走 */
  if('guideDone' in raw || 'guideStep' in raw){
    s.guideDone = raw.guideDone === true;
    s.guideStep = clampInt(raw.guideStep, 0, TOUR_STEPS.length, 0);
    if(s.guideDone) s.guideStep = TOUR_STEPS.length;
  }else if(raw.name){
    s.guideDone = true;
    s.guideStep = TOUR_STEPS.length;
  }else{
    s.guideDone = false;
    s.guideStep = 0;
  }
  s.guideRewarded = raw.guideRewarded === true;
  s.lastSeen = (+raw.lastSeen > 0) ? +raw.lastSeen : Date.now();
  s.day = (typeof raw.day === 'string' && raw.day) ? raw.day : dayStr();
  s.level = levelForFame(s.fame);
  s.v = CONFIG.version;
  return s;
}
function save(){

    const r = localStorage.getItem(SAVE_KEY);

/* ---- 长码导出/导入（导入前自动备份当前档到 BACKUP_KEY，可恢复） ---- */
function exportCode(){

function importCode(code){
  try{
    const obj = JSON.parse(decodeURIComponent(escape(atob(String(code || '').trim()))));
    if(!obj || typeof obj !== 'object' || !obj.name) return false;
    try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(S)); }catch(e){}

    return true;

}

/* ---- 云端短码（照三国 sgvault 协议形状：POST {vaultApi}/yzvault/put|get，
        8 位短码（去易混字符）即凭证，展示加 YZ- 前缀、不入库；
        导入复用长码的 importCode 落地：校验 → 当前档自动备份到 BACKUP_KEY → normalize/save） ---- */
/* 请求层双路（同一文件双用途：Pages 试玩 + Shaper 包，靠能力检测分支，不写死壳内）：
   壳内有 window.ColorboxAI.cloud.request 时优先走平台请求 SDK（照三国 v216 过检形态，
   BFF 路由 /api/yzvault/put|get，应答 r.data.shortCode / r.data.payload）；
   非壳环境回退 fetch(CONFIG.vaultApi + '/yzvault/put|get')，协议与码制不变。 */
function shellVault(){
  return (typeof window !== 'undefined' && window.ColorboxAI && window.ColorboxAI.cloud &&
    typeof window.ColorboxAI.cloud.request === 'function') ? window.ColorboxAI.cloud : null;
}
function vaultConfigured(){
  if(shellVault()) return true;
  return typeof CONFIG.vaultApi === 'string' && /^https?:\/\//.test(CONFIG.vaultApi);
}
async function vaultPut(payload){
  const cloud = shellVault();
  if(cloud){
    const r = await cloud.request({ path:'/api/yzvault/put', method:'POST', data:{ payload } });
    const d = (r && r.data) || null;
    if(!d || !d.shortCode) throw new Error('vault_put_fail');   /* 内部码仅供调用方归类，绝不原样弹给玩家 */
    return d.shortCode;
  }
  const res = await fetch(CONFIG.vaultApi + '/yzvault/put', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ payload }) });
  const j = await res.json().catch(() => null);
  if(!res.ok || !j || j.code !== 0 || !j.data || !j.data.shortCode) throw new Error('vault_put_fail');
  return j.data.shortCode;
}
async function vaultGet(code){
  const cloud = shellVault();
  if(cloud){
    const r = await cloud.request({ path:'/api/yzvault/get', method:'POST', data:{ code } });
    const d = (r && r.data) || null;
    if(!d || typeof d.payload !== 'string') throw new Error('vault_get_fail');
    return d.payload;
  }
  const res = await fetch(CONFIG.vaultApi + '/yzvault/get', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ code }) });
  const j = await res.json().catch(() => null);
  if(!res.ok || !j || j.code !== 0 || !j.data || typeof j.data.payload !== 'string') throw new Error('vault_get_fail');
  return j.data.payload;
}
function normalizeVaultCode(text){
  return String(text || '').trim().toUpperCase().replace(/^YZ-/, '').replace(/\s+/g, '');
}
async function cloudExport(){
  if(!S || !S.name) return { ok:false, msg:'尚未开张，没有可导出的存档' };
  if(!vaultConfigured()) return { ok:false, msg:'云端短码尚未开通（后端部署中），请先用下方长码导出' };
  const payload = JSON.stringify(S);
  if(payload.length > CONFIG.vaultPayloadMax) return { ok:false, msg:'存档太大了，短码装不下，请用长码导出' };
  try{
    const code = await vaultPut(payload);
    return { ok:true, code: CONFIG.vaultPrefix + code };
  }catch(e){ console.warn('cloudExport failed', e); return { ok:false, msg:'上传失败，网络可能不稳，请稍后再试，或改用下方长码导出' }; }
}
async function cloudImport(text){
  const code = normalizeVaultCode(text);
  if(!code) return { ok:false, msg:'先输入短码' };
  if(!/^[A-Z0-9]{8}$/.test(code)) return { ok:false, msg:'短码是 8 位字母数字（可带 YZ- 前缀），长码请用下方长码导入' };
  if(!vaultConfigured()) return { ok:false, msg:'云端短码尚未开通（后端部署中），请改用长码导入' };
  let payload = null;
  try{ payload = await vaultGet(code); }
  catch(e){ console.warn('cloudImport failed', e); return { ok:false, msg:'取档失败：短码可能不对，或网络不稳，请核对后重试' }; }
  /* 落地走 importCode 同一通道：JSON/形状校验不过不动现档，通过则先备份当前档再覆盖 */
  return importCode(btoa(unescape(encodeURIComponent(payload))))
    ? { ok:true }
    : { ok:false, msg:'云端存档内容不对，导入失败（现档未动）' };
}
/* ---- 删档重开（两步确认：requestDelete 武装，confirmDelete 执行） ---- */
let deleteArmedAt = 0;
function requestDelete(){
  deleteArmedAt = Date.now();
  return true;
}
function confirmDelete(){
  if(!deleteArmedAt || Date.now() - deleteArmedAt > 30000) return false;
  deleteArmedAt = 0;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  S = defaultState();
  return true;
}

/* ================= 账本（铜钱/声望/好感唯一收支口） ================= */
function ledger(kind, dCoins, dFame, note, dFavor){
  if(dCoins < 0 && S.coins + dCoins < 0) return false;   /* 余额下限：不许透支 */
  S.coins += dCoins;
  if(dCoins > 0){ S.totalEarned += dCoins; S.dayStats.earned += dCoins; }
  if(dFame) S.fame = Math.max(0, S.fame + dFame);
  if(dFavor) S.favor += dFavor;
  S.level = levelForFame(S.fame);
  if(note) pushLog(note);
  return true;
}

/* ================= 公式（单一事实源） ================= */
function levelForFame(f){
  let lv = 1;
  for(let i = 0; i < CONFIG.fameThresholds.length; i++){
    if(f >= CONFIG.fameThresholds[i]) lv = i + 1;
  }
  return Math.min(lv, CONFIG.fameThresholds.length);
}
function nextLevelFame(){
  return S.level < CONFIG.fameThresholds.length ? CONFIG.fameThresholds[S.level] : null;
}
function packActive(gateKey, now){
  const gate = CONFIG.gates[gateKey];
  if(!gate) return false;
  return dayStr(now || new Date()) >= gate;   /* 本地日期字符串比较，同主作口径 */
}
function staffLv(id){
  return (S.staff[id] && S.staff[id].lv) || 0;
}
function staffIncomeMult(){
  let m = 0;
  for(const t of CONFIG.staffTypes) if(t.incomePerLv) m += staffLv(t.id) * t.incomePerLv;
  return m;
}
function roomPrice(){ return CONFIG.roomPriceBase * CONFIG.qualityMult[S.rooms.quality]; }
function incomeRate(){  /* 每分钟铜钱：在住旅客逐间计价 ×(1+厨房加成+伙计收入加成) */
  let r = 0;
  for(const g of S.guests) r += roomPrice() * (g.priceMult || 1);
  return r * (1 + S.kitchenLv * CONFIG.kitchenMultPerLv + staffIncomeMult());
}
function arrivalChance(){
  return Math.min(0.9, CONFIG.arrivalChancePerTick + S.stableLv * CONFIG.stableArrivalPerLv);
}
function commissionReward(tier){
  const groom = CONFIG.staffTypes.find(t => t.id === 'groom');
  const mult = 1 + S.stableLv * CONFIG.stableRewardPerLv + staffLv('groom') * (groom ? groom.commissionPerLv : 0);
  return { coins: Math.round(tier.coins * mult), fame: tier.fame };
}
function offlineGain(){
  const elapsedMin = (Date.now() - S.lastSeen) / 60000;
  if(elapsedMin < CONFIG.offlineMinMinutes) return 0;
  const capped = Math.min(elapsedMin, CONFIG.offlineCapHours * 60);
  return Math.floor(incomeRate() * capped * CONFIG.offlineRate);
}
/* 离线明牌派生（纯展示，数字全走 incomeRate()/CONFIG 既有口径，不新造公式）：
   capAmt = 当前速率满仓（offlineCapHours）可得；累计分钟按待领金额以离线速率折算 */
function offlineInfo(){
  const rate = incomeRate();
  const offRate = rate * CONFIG.offlineRate;
  const pending = Math.floor(S.offlinePending);
  const capAmt = Math.floor(rate * CONFIG.offlineCapHours * 60 * CONFIG.offlineRate);
  const progressPct = capAmt > 0 ? Math.min(100, pending / capAmt * 100) : (pending > 0 ? 100 : 0);
  const accruedMin = offRate > 0 ? pending / offRate : 0;
  const remainMin = (capAmt > 0 && offRate > 0) ? Math.max(0, (capAmt - pending) / offRate) : 0;
  return { rate: rate, offRate: offRate, pending: pending, capAmt: capAmt,
           progressPct: progressPct, accruedMin: accruedMin, remainMin: remainMin, full: capAmt > 0 && pending >= capAmt };
}
function kitchenCap(){ return Math.min(CONFIG.kitchenMax, S.level + 2); }
function stableCap(){ return Math.min(CONFIG.stableMax, S.level + 1); }
function upgradeCost(kind){
  if(kind === 'room'){
    if(S.rooms.count >= CONFIG.maxRooms) return null;
    return Math.round(CONFIG.addRoomCostBase * Math.pow(CONFIG.addRoomCostGrowth, S.rooms.count - CONFIG.startRooms));
  }
  if(kind === 'quality'){
    if(S.rooms.quality >= CONFIG.maxQuality) return null;
    return Math.round(CONFIG.qualityCostBase * Math.pow(CONFIG.qualityCostGrowth, S.rooms.quality - 1));
  }
  if(kind === 'kitchen'){
    if(S.kitchenLv >= kitchenCap()) return null;
    return Math.round(CONFIG.kitchenCostBase * Math.pow(CONFIG.kitchenCostGrowth, S.kitchenLv));
  }
  if(kind === 'stable'){
    if(S.stableLv >= stableCap()) return null;
    return Math.round(CONFIG.stableCostBase * Math.pow(CONFIG.stableCostGrowth, S.stableLv));
  }
  return null;
}
function staffDef(id){ return CONFIG.staffTypes.find(t => t.id === id) || null; }
function staffCost(id){
  const t = staffDef(id);
  if(!t) return null;
  const cur = S.staff[id];
  if(!cur) return t.hire;
  if(cur.lv >= t.maxLv) return null;
  return Math.round(t.upBase * Math.pow(t.upGrowth, cur.lv - 1));
}
function guestPool(){
  return CONFIG.guestTypes.filter(t =>
    S.level >= t.minLevel &&
    S.kitchenLv >= (t.minKitchen || 0) &&
    S.stableLv >= (t.minStable || 0) &&
    (!t.gate || packActive(t.gate)));
}
function metricValue(metric){
  switch(metric){
    case 'totalGuests': return S.totalGuests;
    case 'rooms': return S.rooms.count;
    case 'quality': return S.rooms.quality;
    case 'kitchen': return S.kitchenLv;
    case 'stable': return S.stableLv;
    case 'staffCount': return Object.keys(S.staff).length;
    case 'staffLevels': return CONFIG.staffTypes.reduce((a, t) => a + staffLv(t.id), 0);
    case 'seen': return Object.keys(S.guestsSeen).length;
    case 'totalEarned': return S.totalEarned;
    case 'commissions': return S.totalCommissions;
    case 'level': return S.level;
    default: return 0;
  }
}
function eventPool(){
  const daily = CONFIG.events.filter(e => e.pool === 'daily');
  if(packActive('banquet')) return daily.concat(CONFIG.events.filter(e => e.pool === 'banquet'));
  return daily;
}

function randName(){
  const sn = CONFIG.surnames[Math.floor(Math.random() * CONFIG.surnames.length)];
  const gn = CONFIG.givenNames[Math.floor(Math.random() * CONFIG.givenNames.length)];
  return sn + gn;
}
function pickWeighted(pool){
  let total = 0;
  for(const t of pool) total += t.weight;
  let r = Math.random() * total;
  for(const t of pool){ r -= t.weight; if(r <= 0) return t; }
  return pool[pool.length - 1];
}
function arriveGuest(){
  if(S.guests.length >= S.rooms.count) return false;
  const pool = guestPool();
  if(!pool.length) return false;
  const t = pickWeighted(pool);
  const g = {
    type: t.id, label: t.label, name: randName(),
    priceMult: t.priceMult,
    stayLeft: randInt(CONFIG.stayMinTicks, CONFIG.stayMaxTicks)
  };
  S.guests.push(g);
  S.guestsSeen[t.id] = true;
  S.totalGuests++;
  S.dayStats.guests++;
  pushLog(t.label + ' ' + g.name + ' 推门入住');
  return true;
}

/* ================= 跨日与晨间小结 ================= */
function pickEventsForDay(){
  const pool = eventPool().slice();
  const picked = [];
  while(picked.length < CONFIG.eventsPerDay && pool.length){
    picked.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0].id);
  }
  return picked;
}
function rollDayIfNeeded(){
  const today = dayStr();
  if(S.day === today) return false;
  /* 晨间小结：汇总昨夜（上一日）入住与收入，数据卡凭 morning 字段展示 */
  S.morning = {
    date: S.day,
    guests: S.dayStats.guests,
    earned: S.dayStats.earned,
    offline: Math.floor(S.offlinePending)
  };
  S.day = today;
  S.dayStats = { guests: 0, earned: 0 };
  S.ads = {};
  S.eventsToday = pickEventsForDay();
  S.eventsDone = 0;
  pushLog('新的一天，晨间小结已备好');
  return true;
}
function dismissMorning(){
  S.morning = null;
  save();
  renderMorning();
}

/* ================= 主循环 ================= */
let S = null;
let tickTimer = null;
function tick(){
  if(!S || !S.name) return;
  let changed = false;
  if(rollDayIfNeeded()){ changed = true; renderMorning(); renderEvents(); renderAdsBox(); }
  if(S.guests.length < S.rooms.count && Math.random() < arrivalChance()){
    if(arriveGuest()) changed = true;
  }
  for(const g of S.guests.slice()){
    g.stayLeft--;
    if(g.stayLeft <= 0){
      S.guests.splice(S.guests.indexOf(g), 1);
      changed = true;
      if(Math.random() < CONFIG.famePerCheckoutChance){
        ledger('fame', 0, CONFIG.famePerCheckout, '旅客 ' + g.name + ' 结账离店，声望 +' + CONFIG.famePerCheckout);
      }else{
        pushLog('旅客 ' + g.name + ' 结账离店');
      }
    }
  }
  S.acc += incomeRate() * (CONFIG.tickMs / 60000);
  const whole = Math.floor(S.acc);
  if(whole > 0){ S.acc -= whole; ledger('income', whole, 0, null); }
  save();
  updateDynamic();
  renderRooms();
  updateCommissionTimes();
  if(changed) renderLog();
}

function startCommission(tierId){
  if(!packActive('commission')){ showToast('商队委托将于 2026-11-19 开放'); return false; }
  const tier = CONFIG.commissionTiers.find(t => t.id === tierId);
  if(!tier) return false;
  if(S.commissions.length >= CONFIG.commissionMaxActive){ showToast('同时进行的委托已满'); return false; }
  const now = Date.now();
  S.commissions.push({
    id: 'cm' + now + '_' + Math.floor(Math.random() * 100000),
    tierId: tier.id, hours: tier.hours,
    start: now, end: now + tier.hours * 3600 * 1000,
    claimed: false
  });
  pushLog('接下商队委托（' + tier.hours + ' 小时）');
  save();
  renderCommissions();
  renderLog();
  return true;
}
function commissionReady(c){ return Date.now() >= c.end; }
function claimCommission(id){
  const c = S.commissions.find(x => x.id === id);
  if(!c || c.claimed) return false;            /* 防重复领取 */
  if(!commissionReady(c)){ showToast('商队尚未归来'); return false; }
  const tier = CONFIG.commissionTiers.find(t => t.id === c.tierId);
  if(!tier) return false;
  const rw = commissionReward(tier);
  c.claimed = true;
  S.commissions = S.commissions.filter(x => x.id !== id);
  S.totalCommissions++;
  ledger('commission', rw.coins, rw.fame, '商队委托完成，报酬 +' + rw.coins + ' 铜钱');
  save();
  renderCommissions();
  renderMilestones();
  updateDynamic();
  renderLog();
  showToast('委托报酬到账 +' + rw.coins + ' 铜钱' + (rw.fame ? ' / 声望 +' + rw.fame : ''));
  return true;
}

function shellAd(){
  if(typeof window !== 'undefined'){
    if(window.vataskAd && typeof window.vataskAd.showRewarded === 'function') return window.vataskAd;
    if(window.VATASK && typeof window.VATASK.showRewarded === 'function') return window.VATASK;
  }
  return null;
}
function showRewardAd(placement, onReward){
  const shell = shellAd();
  if(shell){
    let done = false;
    shell.showRewarded(placement, function(res){
      if(done) return; done = true;
      if(res && res.code === 200 && res.rewarded === true) onReward();
      else showToast('广告未看完，没有奖励');
    });
  }else{
    setTimeout(onReward, CONFIG.adSimMs);   /* 非壳环境模拟 */
  }
}

/* 明日预告（纯展示）：由日期门 gates 与下一等级声望差派生，不发奖、不写存档 */
function tomorrowPreview(){
  const parts = [];
  const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
  const tmrStr = dayStr(tmr);
  const upcoming = Object.keys(CONFIG.gates)
    .filter(k => !packActive(k))
    .sort((a, b) => CONFIG.gates[a] < CONFIG.gates[b] ? -1 : 1);
  if(upcoming.length){
    const k = upcoming[0], g = CONFIG.gates[k], label = GATE_LABELS[k] || k;
    parts.push(tmrStr >= g
      ? '明日（' + g + '）开启：' + label
      : '下一站：' + label + ' 将于 ' + g + ' 开启');
  }else{
    parts.push('限时内容已全部开启');
  }
  const nf = nextLevelFame();
  if(nf === null) parts.push('驿站已是最高等级');
  else parts.push('再攒 ' + Math.max(0, nf - S.fame) + ' 声望升至 ' + (S.level + 1) + ' 级（解锁更多旅客与设施上限）');
  return parts.join('；');
}

function clampInt(v, lo, hi, dft){
  v = Math.floor(+v);
  if(!isFinite(v)) return dft;
  return Math.min(hi, Math.max(lo, v));
}
function randInt(lo, hi){ return lo + Math.floor(Math.random() * (hi - lo + 1)); }
function dayStr(d){
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function timeStr(){
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function pushLog(msg){
  S.log.unshift(timeStr() + ' · ' + msg);
  if(S.log.length > 8) S.log.length = 8;
}
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  t.classList.remove('pop');
  void t.offsetWidth;   /* 重启动画，给领取动作一个即时跳字反馈 */
  t.classList.add('pop');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 2200);
}


/* ================= 新手引导（照联赛 v58/v59 讲解台形态移植） =================
   底部讲解台固定停靠、位置零计算零跳动；高亮圈独立追踪；页面留 330px 底部滚动空间；
   先讲后用：动作步无「下一步」、只认真实操作（tourHook）推进；
   目标不在场/弹窗被关/切页时自动回退或跳过对应步，不乱指、不堵屏（气泡 pointer-events:none，仅按钮可点）。
   状态走存档字段 guideStep/guideDone/guideRewarded（normalize 加法加入）：
   新档（未开张）从头走；老档默认标完成不补弹；删档后新档重新走。 */
const TOUR_STEPS = [
  { id:'open', action:'open', target:() => document.getElementById('openBtn'),
    title:'先开张：给驿站起个名字',
    body:'名字随你起，不填就叫「风来驿站」。点高亮的「开张大吉」，今夜就挂牌。' },
  { id:'guests', target:() => document.getElementById('roomsGrid'),
    title:'旅客自己会来，房钱自动进账',
    body:'旅客自动推门入住，住满就不再进客；房钱按分钟慢慢攒，人在不在都算。' },
  { id:'offline', action:'offline', target:() => document.getElementById('offlineCard'),
    title:'离线收益，亲手领这一笔',
    body:'老掌柜把刚才这会儿快进成离线十分钟：旅客投宿又离店，账已攒在这张卡上。点卡上的「领取」亲手收下；平时关掉游戏也照 55% 攒，封顶 12 小时。' },
  { id:'upgrade', target:() => document.getElementById('upRoomBtn') || document.getElementById('upgradesCard'),
    title:'有钱先扩建，再提品质',
    body:'扩建多接客，品质抬房价；往下还有厨房和马厩，各有加成，按钮上就是价钱。' },
  { id:'staff', target:() => document.querySelector('#staffBox .up-row') || document.getElementById('staffCard'),
    title:'伙计：雇来帮你多赚钱',
    body:'掌柜、小二、厨子、马夫各管一条加成，雇佣和升级都在这一区办。' },
  { id:'eventIntro', target:() => document.getElementById('eventsBox'),
    title:'每日抉择：一天三张，先讲规矩',
    body:'旅客的小麻烦、小机缘，一天三张，任选一个处置——影响铜钱、声望和好感。下一张由你亲手选。' },
  { id:'eventDo', action:'event', target:() => document.getElementById('eventsBox'),
    title:'亲手处理一张抉择',
    body:'点下面任意一个选项，选完自动继续；铜钱不够的选项点不动。' },
  { id:'miles', target:() => document.querySelector('#milesBox .up-row') || document.getElementById('milesCard'),
    title:'里程碑：照着目标领赏',
    body:'接待、扩建、图鉴都有里程碑，达标回来点「领取」；最上面四条开张贴士，走完引导也留着复看。' },
  { id:'codex', target:() => document.querySelector('#codexCard h3') || document.getElementById('codexCard'),
    title:'图鉴：认全 32 种旅客',
    body:'接待过的旅客会点亮图鉴；等级、厨房、马厩越高，来的客越金贵。' },
  { id:'save', target:() => document.querySelector('#saveCard h3') || document.getElementById('saveCard'),
    title:'存档在最下面，短码换设备取回',
    body:'存档区有本地 5 槽、云端短码和长码兜底；换设备前先生成短码，输码就能取回整档。' },
  { id:'finish', noring:true, target:null,
    title:'领路到此，去接第一拨客吧',
    body:'记住三件事：旅客自动来、离线也有钱、有钱先扩建。走完这趟，老掌柜备了 ' + CONFIG.guideReward + ' 铜钱谢礼，点「完成引导」领取。' }
];
let tourActive = false;
let TOUR_TIMER = null;
let tourSeededGuest = false;   /* 旅客步造真客只做一次（运行时标记，不入存档） */
let tourSeededOffline = false; /* 离线步造真待领只做一次（运行时标记，不入存档） */
let tourYielded = false;       /* 真实弹窗（离线规则）在场时引导让行，关后接回 */
/* 旅客步：房里还没客时用真实入住流程迎一拨客再讲，不对着空房讲 */
function tourSeedGuest(){
  if(tourSeededGuest || !S || !S.name) return;
  tourSeededGuest = true;
  if(S.guests.length === 0) arriveGuest();
}
/* 离线步：新档刚开张 offlinePending 必为 0，空讲违规——按清单造真实对象：
   先保证有客（真实入住），再把 lastSeen 回拨 10 分钟走真实 settleOffline 结算，
   待领金额由 offlineGain() 公式算出，不写死、不绕公式；玩家在本步亲手领取入账。 */
function tourSeedOffline(){
  if(tourSeededOffline || !S || !S.name) return;
  if(S.offlinePending >= 1){ tourSeededOffline = true; return; }
  if(S.guests.length === 0) arriveGuest();
  if(incomeRate() <= 0) return;
  S.lastSeen = Date.now() - 10 * 60000;
  settleOffline();
  if(S.offlinePending >= 1){
    tourSeededOffline = true;
    /* 结算完立刻重绘相关卡：不许讲解说「账已攒好」而卡面还停在「暂无待领」 */
    renderOffline(); renderRooms(); renderToday(); updateDynamic(); renderLog();
  }
}
function tourModalOpen(){
  const m = document.getElementById('rulesMask');
  return !!(m && m.style.display !== 'none');
}
function tourHideEls(){
  const r = document.getElementById('tourRing'), b = document.getElementById('tourBubble');
  if(r) r.style.display = 'none';
  if(b) b.style.display = 'none';
}
/* 引导计时器：高亮圈追踪 + 弹窗让行监测（弹窗在场收起讲解台，关后接回当前步） */
function tourStartTimer(){
  if(TOUR_TIMER) clearInterval(TOUR_TIMER);
  TOUR_TIMER = setInterval(() => {
    if(!tourActive || !S || S.guideDone){ clearInterval(TOUR_TIMER); TOUR_TIMER = null; return; }
    if(tourModalOpen()){
      if(!tourYielded){ tourYielded = true; tourHideEls(); }
      return;
    }
    if(tourYielded){ tourYielded = false; tourShow(); return; }
    const st = TOUR_STEPS[tourIdx()];
    tourPlace(st && st.target ? st.target() : null);
  }, 700);
}
function tourIdx(){ return clampInt(S ? S.guideStep : 0, 0, TOUR_STEPS.length, 0); }
function tourAutoStart(force){
  if(navigator.webdriver && !force) return;   /* 自动化环境不自动弹，探针手动开 */
  if(!S || S.guideDone) return;
  tourShow();
}
function tourStart(manual){
  if(!S) return;
  S.guideDone = false;
  S.guideStep = 0;               /* guideRewarded 保留：重看不再发谢礼 */
  save();
  tourShow();
}
function tourShow(){
  if(!S || S.guideDone){ tourHide(); return; }
  /* 空状态先行造真：旅客步保证有客、离线步保证有真实待领（公式结算），不空讲 */
  const cur0 = TOUR_STEPS[tourIdx()];
  if(cur0 && cur0.id === 'guests') tourSeedGuest();
  if(cur0 && cur0.id === 'offline') tourSeedOffline();
  /* 上下文校正：目标所依赖的界面不在场时回退/跳过对应步，绝不对着空页面乱指 */
  let guard = 0;
  while(guard++ < TOUR_STEPS.length + 2){
    const st = TOUR_STEPS[tourIdx()];
    if(!st){ tourFinish(true); return; }
    if(st.id === 'open' && S.name){ S.guideStep++; continue; }
    if(st.id !== 'open' && !S.name){ S.guideStep = 0; break; }
    if(st.action === 'event' && !currentEvent()){ S.guideStep++; continue; }
    if(st.action === 'offline' && tourSeededOffline && S.offlinePending < 1){ S.guideStep++; continue; }
    break;
  }
  const step = TOUR_STEPS[tourIdx()];
  if(!step){ tourFinish(true); return; }
  /* 真实弹窗（离线规则）在场：引导让行——收起讲解台与高亮圈、暂停讲解，
     不抢屏、不自动收掉玩家的弹窗；弹窗关闭后由计时器接回当前步 */
  if(tourModalOpen()){
    tourYielded = true;
    tourActive = true;
    tourHideEls();
    tourStartTimer();
    save();
    return;
  }
  tourYielded = false;
  tourActive = true;
  let tries = 0;
  const attempt = () => {
    const el = step.target ? step.target() : null;
    if(!el && step.target && tries++ < 10){ setTimeout(attempt, 250); return; }
    tourRender(step, el);
  };
  attempt();
  tourStartTimer();
  save();
}
function tourRender(step, el){
  const bub = document.getElementById('tourBubble');
  if(!bub) return;
  document.body.classList.add('touring');
  const i = tourIdx();
  const actHint = { open:'👆 点高亮的「开张大吉」，点了自动继续', event:'👆 点高亮区里的任意选项，选了自动继续', offline:'👆 点明牌卡上的「领取」，领了自动继续' }[step.action];
  const right = actHint
    ? '<span class="tmeta" style="align-self:center">' + actHint + '</span>'
    : '<button class="small accent" onclick="tourNext()">' + (i === TOUR_STEPS.length - 1 ? '完成引导' : '下一步') + '</button>';
  const dots = TOUR_STEPS.map((_, k) => '<span class="' + (k === i ? '' : 'off') + '">●</span>').join('');
  bub.innerHTML =
    '<div class="trow"><span class="tmeta">🧭 新手引导 ' + (i + 1) + '/' + TOUR_STEPS.length + ' · 老掌柜领路</span><span class="tourDots">' + dots + '</span></div>' +
    '<div class="ttitle">' + step.title + '</div>' +
    '<div class="tbody">' + step.body + '</div>' +
    '<div class="tbtns"><button class="small ghost" onclick="tourSkip()">跳过引导</button>' + right + '</div>';
  bub.style.display = '';
  if(el){
    try{
      const r0 = el.getBoundingClientRect(), vh = window.innerHeight, dockTop = vh - (bub.offsetHeight || 170);
      if(r0.top < 8 || r0.bottom > dockTop - 6){
        el.scrollIntoView({ block: r0.height > vh * 0.45 ? 'start' : 'center', behavior: 'auto' });
      }
    }catch(e){}
  }
  setTimeout(() => tourPlace(el), 60);
  tourPlace(el);
}
function tourPlace(el){
  const ring = document.getElementById('tourRing'), bub = document.getElementById('tourBubble');
  if(!ring || !bub || bub.style.display === 'none') return;
  const step = TOUR_STEPS[tourIdx()];
  if(!el || (step && step.noring)){ ring.style.display = 'none'; return; }
  const r = el.getBoundingClientRect();
  if(r.width === 0 || r.height < 6){ ring.style.display = 'none'; return; }
  ring.style.display = '';
  ring.style.left = (r.left - 5) + 'px';
  ring.style.top = (r.top - 5) + 'px';
  ring.style.width = (r.width + 10) + 'px';
  ring.style.height = (r.height + 10) + 'px';
}
function tourNext(){
  if(!S || S.guideDone) return;
  S.guideStep = tourIdx() + 1;
  save();
  if(tourIdx() >= TOUR_STEPS.length){ tourFinish(true); return; }
  tourShow();
}
function tourSkip(){ tourFinish(false); }
function tourFinish(completed){
  if(!S) return;
  S.guideDone = true;
  S.guideStep = TOUR_STEPS.length;
  let rewarded = false;
  if(completed && !S.guideRewarded){
    S.guideRewarded = true;
    rewarded = !!S.name;
    if(rewarded) ledger('guide', CONFIG.guideReward, 0, '新手引导走完，老掌柜谢礼 +' + CONFIG.guideReward + ' 铜钱');
  }
  save();
  tourHide();
  if(S.name){ updateDynamic(); renderLog(); }
  if(rewarded) showToast('引导完成，谢礼 +' + CONFIG.guideReward + ' 铜钱已到账');
}
function tourHide(){
  const r = document.getElementById('tourRing'), b = document.getElementById('tourBubble');
  if(r) r.style.display = 'none';
  if(b) b.style.display = 'none';
  document.body.classList.remove('touring');
  if(TOUR_TIMER){ clearInterval(TOUR_TIMER); TOUR_TIMER = null; }
  tourActive = false;
}
function tourHook(ev){
  if(!tourActive || !S || S.guideDone) return;
  const step = TOUR_STEPS[tourIdx()];
  if(!step) return;
  if(ev === 'open' && step.action === 'open'){ tourNext(); return; }
  if(ev === 'event' && step.action === 'event'){ tourNext(); return; }
  if(ev === 'offline' && step.action === 'offline'){ tourNext(); return; }
}

/* ================= 启动 ================= */
function settleOffline(){
  const gain = offlineGain();
  if(gain >= 1){
    S.offlinePending += gain;
    S.guests = [];
    pushLog('离线期间有旅客投宿，房钱待领取');
  }
  rollDayIfNeeded();
  save();
}
function startApp(){
  renderMain();
  if(tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(tick, CONFIG.tickMs);
}
function boot(){
  const loaded = load();
  if(loaded && loaded.name){
    S = loaded;
    settleOffline();
    startApp();
  }else{
    S = loaded || defaultState();
    renderNaming();
  }
  setTimeout(() => { try{ tourAutoStart(); }catch(e){} }, 600);
}
document.addEventListener('visibilitychange', () => { if(document.hidden) save(); });
window.addEventListener('beforeunload', save);
boot();

/* 测试探针出口（不参与游戏逻辑） */
window.YZ = {
  get state(){ return S; },
  CONFIG: CONFIG,
  incomeRate: incomeRate, offlineGain: offlineGain, upgradeCost: upgradeCost, guestPool: guestPool,
  arrivalChance: arrivalChance, commissionReward: commissionReward, packActive: packActive,
  staffCost: staffCost, staffLv: staffLv, metricValue: metricValue, eventPool: eventPool,
  ledger: function(k, c, f){ return ledger(k, c, f, null); },
  buyUpgrade: buyUpgrade, buyStaff: buyStaff,
  currentEvent: currentEvent, doEventChoice: doEventChoice,
  startCommission: startCommission, claimCommission: claimCommission, instantCommission: instantCommission,
  claimMilestone: claimMilestone, claimDailyGift: claimDailyGift,
  claimOffline: claimOffline, claimOfflineDouble: claimOfflineDouble,
  showRewardAd: showRewardAd,
  saveSlot: saveSlot, loadSlot: loadSlot, slotInfo: slotInfo,
  exportCode: exportCode, importCode: importCode, restoreBackup: restoreBackup, hasBackup: hasBackup,
  vaultConfigured: vaultConfigured, cloudExport: cloudExport, cloudImport: cloudImport,
  vaultPut: vaultPut, vaultGet: vaultGet,
  hasShellVault: function(){ return !!shellVault(); },
  offlineInfo: offlineInfo, tomorrowPreview: tomorrowPreview,
  todaySummary: todaySummary, codexGroupProgress: codexGroupProgress,
  showOfflineRules: showOfflineRules, hideOfflineRules: hideOfflineRules,
  renderOffline: renderOffline, renderToday: renderToday, renderMorning: renderMorning,
  renderCodex: renderCodex, renderMilestones: renderMilestones,
  setVaultApi: function(u){ CONFIG.vaultApi = u; },
  requestDelete: requestDelete, confirmDelete: confirmDelete,
  rollDayIfNeeded: rollDayIfNeeded, pickEventsForDay: pickEventsForDay,
  dismissMorning: dismissMorning,
  tourStart: tourStart, tourNext: tourNext, tourSkip: tourSkip, tourShow: tourShow,
  tourAutoStart: tourAutoStart, tourHook: tourHook, tourSteps: TOUR_STEPS,
  tourState: function(){ return S ? { i: tourIdx(), done: !!S.guideDone, rewarded: !!S.guideRewarded, active: tourActive } : null; },
  arriveGuest: arriveGuest, save: save, load: load, normalize: normalize,
  halt: function(){ if(tickTimer){ clearInterval(tickTimer); tickTimer = null; } }
};
</script>
